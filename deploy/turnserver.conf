# coturn — STUN-only configuration for ChunkDrop's VPS (DEPLOY-VPS.md).
#
# Clients only need server-reflexive candidates for WebRTC NAT
# traversal (engine.toml: stun_url = "stun:drop.404.mn:3478"). The
# relay fallback is the hub's own WSS relay (step ③, capped), NOT
# TURN — so coturn runs as a pure STUN server: no credentials, no
# databases, no TLS, no relay. Option names verified against coturn
# 4.19 (the :4-alpine image); a rejected line here kills the
# container (exit 255), which is what the round-1 config learned.
listening-port=3478

# STUN only: every TURN request (allocation/relay) is ignored. This is
# the one-switch form — 4.19 rejects `no-udp-relay` + `no-tcp-relay`
# used together ("options cannot be used together").
stun-only
# Defense in depth should stun-only ever be dropped: never relay to
# multicast groups.
no-multicast-peers
# No TLS/DTLS listeners: no certificates are provisioned here and
# WebRTC engines speak plain UDP STUN. (no-tls is valid in 4.19;
# no-dtls is not — the 4.19 build rejects it as bad config format.)
no-tls

# Logging: everything to stdout, once. coturn's default is stdout AND
# syslog, which duplicated every line in `docker logs`; log-file=stdout
# is what the image's own default CMD uses.
log-file=stdout
# Reply fingerprint bit (RFC 5389 integrity marker).
fingerprint
