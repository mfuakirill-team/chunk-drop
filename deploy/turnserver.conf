# coturn — STUN-only configuration for ChunkDrop's VPS (DEPLOY-VPS.md).
#
# Clients only need server-reflexive candidates for WebRTC NAT
# traversal (engine.toml: stun_url = "stun:drop.404.mn:3478"). The
# relay fallback is the hub's own WSS relay (step ③, capped), NOT
# TURN — so every relaying/allocation feature of coturn is switched
# off here: the container answers STUN binding requests and nothing
# else. No credentials, no databases, no TLS.
listening-port=3478

# STUN only: refuse TURN allocations (media relay through this server).
no-tcp-relay
no-udp-relay
no-multicast-peers
# No TURN credentials / databases (STUN needs no auth).
no-cli
no-tls
no-dtls
no-stdout-log
# Reply fingerprint bit (RFC 5389 integrity marker).
fingerprint
