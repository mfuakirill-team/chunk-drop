# ChunkDrop hub deployment (M2) — the ONLY container stack in this repo.
# The hub never joins a LAN, holds no files, stores nothing on disk:
# presence + WebRTC signaling (+ the WSS relay fallback in a later
# step) live in RAM only. Authentication is per connection — group tag
# + device-key signature — so there are NO env vars, NO secrets, NO
# volumes here.
#
#   hub  :8080 → published on localhost only; nginx (TLS) is the front
#          door: deploy/nginx-site.conf.example on the host.
#   stun : coturn in STUN-only mode (no TURN credentials, no relay) —
#          server-reflexive candidates for WebRTC NAT traversal
#          (engine.toml: stun_url). Host network so coturn sees the
#          VPS's real IP (reflexive-address reporting must not be NATed).
#
# Usage (on the VPS):
#   cd ~/chunkdrop/deploy && docker compose up -d --build
#   curl -s http://127.0.0.1:8085/healthz   # → ok
services:
  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: chunkdrop-hub
    container_name: chunkdrop-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8080" # localhost only — nginx is the front door
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # NOTE: no volumes, no environment — the hub is stateless by
    # design (PLAN.md D5) and authenticates clients itself.

  stun:
    image: coturn/coturn:4-alpine
    container_name: chunkdrop-stun
    restart: unless-stopped
    # STUN responses carry the server's own addresses; inside a bridge
    # network those would be Docker-internal IPs, so coturn runs on the
    # host network (the standard coturn-on-a-VPS setup).
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    read_only: true
    cap_drop: [ALL]
    # NO `no-new-privileges` here (the hub keeps it): the coturn image
    # ships file capabilities on /usr/bin/turnserver
    # (setcap CAP_NET_BIND_SERVICE=+ep), and Linux refuses execve with
    # EPERM for a file with fcaps when no_new_privs is set — the
    # container would die with exit 126 "Operation not permitted".
    # Hardening is not weakened: the image already runs as
    # nobody:nogroup, the empty capability bounding set (cap_drop ALL)
    # masks the file cap at exec, and the rootfs is read-only. STUN
    # binds port 3478 — unprivileged, no cap needed.
