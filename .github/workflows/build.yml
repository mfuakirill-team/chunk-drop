# CI: build all distribution binaries on every push, and on demand
# (the "Run workflow" button in the Actions tab — for reruns when the
# automatic build didn't work). No workflow artifacts: GitHub's
# artifact format is a zip and we serve binaries as-is — main/manual
# runs publish straight to the rolling "dev-build" prerelease, tagged
# v* pushes go through release.yml (branch/tag filters are disjoint).
# Branch runs only build+test (no binaries are kept for them).
name: Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

# The job publishes to the dev-build release on main/manual runs.
permissions:
  contents: write

concurrency:
  # Same-ref runs supersede each other (a new main push cancels the
  # still-running older one); different refs run independently. Main
  # is the only publishing ref, so the dev-build replace never races.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install base packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git make gh ca-certificates

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # One make invocation: the `web` prerequisite runs once, then all
      # four cross-compiled engines are built. No plain `bin/engine` —
      # it would duplicate engine-linux-amd64. Tests run AFTER the
      # build: internal/webdist embeds all:dist, which exists only
      # once `make web` has run (fresh checkout has no dist dir).
      - name: Build engines (windows-amd64, linux-amd64, linux-arm64, darwin-arm64)
        run: make engine-win engine-linux engine-mac

      - name: Test
        run: go test ./... -count=1

      - name: SHA256 checksums
        run: cd bin && sha256sum engine-windows-amd64.exe engine-linux-amd64 engine-linux-arm64 engine-darwin-arm64 > SHA256SUMS

      # Raw binaries, as-is (GitHub only serves unzipped files as
      # Release assets): every main/manual build replaces the rolling
      # "dev-build" prerelease. It's a prerelease, so it never steals
      # the "Latest" badge from tagged v* releases — those stay the
      # stable path.
      - name: Publish raw binaries to the dev-build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev-build --yes --cleanup-tag || true
          gh release create dev-build \
            --prerelease \
            --title "Dev build — latest main" \
            --notes "Raw engine binaries built from the latest main (${GITHUB_SHA}). Not a stable release — use the tagged v* releases." \
            bin/engine-windows-amd64.exe bin/engine-linux-amd64 bin/engine-linux-arm64 bin/engine-darwin-arm64 bin/SHA256SUMS