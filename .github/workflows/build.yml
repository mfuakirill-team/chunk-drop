# CI: build all distribution binaries on every push, and on demand
# (the "Run workflow" button in the Actions tab — for reruns when the
# automatic build didn't work). Branch/tag filters are disjoint from
# release.yml, so tag pushes don't double-build. Raw, unzipped binaries
# land on the rolling "dev-build" prerelease for main/manual runs —
# GitHub's artifact system always zips, so the Release page is the only
# as-is download path.
name: Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install base packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git make ca-certificates

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # One make invocation: the `web` prerequisite runs once, then all
      # four cross-compiled engines are built. No plain `bin/engine` —
      # it would duplicate engine-linux-amd64. Tests run AFTER the
      # build: internal/webdist embeds all:dist, which exists only
      # once `make web` has run (fresh checkout has no dist dir).
      - name: Build engines (windows-amd64, linux-amd64, linux-arm64, darwin-arm64)
        run: make engine-win engine-linux engine-mac

      - name: Test
        run: go test ./... -count=1

      # One artifact per binary (the zip is GitHub's artifact format —
      # unavoidable). These feed the publish job below; on branch runs
      # they are also the only way to grab that branch's binaries.
      - name: Upload engine-windows-amd64.exe
        uses: actions/upload-artifact@v4
        with:
          name: engine-windows-amd64.exe
          path: bin/engine-windows-amd64.exe
          if-no-files-found: error

      - name: Upload engine-linux-amd64
        uses: actions/upload-artifact@v4
        with:
          name: engine-linux-amd64
          path: bin/engine-linux-amd64
          if-no-files-found: error

      - name: Upload engine-linux-arm64
        uses: actions/upload-artifact@v4
        with:
          name: engine-linux-arm64
          path: bin/engine-linux-arm64
          if-no-files-found: error

      - name: Upload engine-darwin-arm64
        uses: actions/upload-artifact@v4
        with:
          name: engine-darwin-arm64
          path: bin/engine-darwin-arm64
          if-no-files-found: error

  # Raw binaries, as-is (no zip — GitHub only serves raw files as
  # Release assets): every main/manual build replaces the rolling
  # "dev-build" prerelease. Serialized so two pushes can't race the
  # delete+recreate. Tagged v* releases (release.yml) stay the stable
  # path; a prerelease never steals the "Latest" badge from them.
  publish-dev-build:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    permissions:
      contents: write
    concurrency:
      group: dev-build
      cancel-in-progress: false
    steps:
      - name: Install gh
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gh ca-certificates

      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true

      - name: SHA256 checksums
        run: cd bin && sha256sum engine-windows-amd64.exe engine-linux-amd64 engine-linux-arm64 engine-darwin-arm64 > SHA256SUMS

      - name: Replace the dev-build release with raw binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev-build --yes --cleanup-tag || true
          gh release create dev-build \
            --prerelease \
            --title "Dev build — latest main" \
            --notes "Raw engine binaries built from the latest main (${GITHUB_SHA}). Not a stable release — use the tagged v* releases." \
            bin/engine-windows-amd64.exe bin/engine-linux-amd64 bin/engine-linux-arm64 bin/engine-darwin-arm64 bin/SHA256SUMS
